# Render — Python API (simplest, most reliable)
# Fresh deploy: https://render.com/deploy?repo=https://github.com/tusharphalke19995/Today-s-Mandi-Prices

services:
  - type: web
    name: mandi-prices-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./mandi_prices.db
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: DATA_GOV_API_KEY
        sync: false
        # Register free key at https://data.gov.in → My Account → Generate API Key
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SYNC_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://dailymandiupdate.naliniudyogsamuh.com
