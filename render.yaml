# Render — ONE service (website + API together)
# Deploy: https://render.com/deploy?repo=https://github.com/tusharphalke19995/Today-s-Mandi-Prices
#
# LIVE URL: https://mandi-prices-api.onrender.com
# (Do NOT use mandi-prices-web — delete that old service)

services:
  - type: web
    name: mandi-prices-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./mandi_prices.db
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: DATA_GOV_API_KEY
        value: 579b464db66ec23bdd000001cdd3946e44ce57746370fffc958d3611
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SYNC_API_KEY
        generateValue: true
