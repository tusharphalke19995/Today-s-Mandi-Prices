# Render Blueprint — free hosting (API + website)
# Deploy: https://render.com/deploy?repo=https://github.com/tusharphalke19995/Today-s-Mandi-Prices

services:
  # Backend API (+ website fallback at same URL)
  - type: web
    name: mandi-prices-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./mandi_prices.db
      - key: SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: DATA_GOV_API_KEY
        value: 579b464db66ec23bdd000001cdd3946e44ce57746370fffc958d3611
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SYNC_API_KEY
        generateValue: true

  # Public website — Node web service (more reliable than static site)
  - type: web
    name: mandi-prices-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: VITE_API_HOST
        fromService:
          type: web
          name: mandi-prices-api
          property: host
